server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: studyhub-logs
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            event: event
            app_version: app_version
            message: message
            ts: ts
      - timestamp:
          source: ts
          format: RFC3339
      - labels:
          level:
          logger:
          event:
          app_version:
    static_configs:
      - targets: [localhost]
        labels:
          job: studyhub
          app: studyhub
          __path__: /var/log/studyhub/*.log
